services:
  tutorai-mongo:
    image: mongo:latest
    container_name: tutorai-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    env_file:
      - /home/vincent/Repo/secrets/tutor.env
    networks:
      - tutorai-network

  tutorai-app:
    build:
      context: ../app_api
      dockerfile: Dockerfile
    container_name: tutorai-app
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_PORT=27017  # Inside Docker network, use internal port
    env_file:
      - /home/vincent/Repo/secrets/tutor.env
    volumes:
      - ../app_api/static:/app/static
      - ../app_api/templates:/app/templates
    ports:
      - "5001:5001"
    networks:
      - tutorai-network
    depends_on:
      - tutorai-mongo

volumes:
  mongo_data:
  huggingface_cache:

networks:
  tutorai-network:

